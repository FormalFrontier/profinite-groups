name = "profinite-groups"
version = "0.1.0"
defaultTargets = ["ProfiniteGroups", "ProfiniteGroupsTests"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "83abb3e776bdefcbc447a1e44d0debe4010039e5"

[[require]]
name = "groupTheory"
git = "https://github.com/FormalFrontier/group-theory.git"
rev = "77c1f2663514f8d43db606d3eb3409533a6e29a5"

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false

[[lean_lib]]
name = "ProfiniteGroups"

[[lean_lib]]
name = "ProfiniteGroupsTests"
globs = ["ProfiniteGroupsTests.*", "Tests.CompatibleSubgroups", "Tests.CompatibleSylow",
  "Tests.DirectImports", "Tests.PrimewisePadicIdealTransport",
  "Tests.PrimewisePadicKernelTransport", "Tests.PrimewisePadicQuotients",
  "Tests.ProcyclicBaseMap", "Tests.ProcyclicGeneratorIndependence", "Tests.ProcyclicHom",
  "Tests.ProcyclicInvariant", "Tests.ProcyclicPower", "Tests.ProcyclicQuotient",
  "Tests.ProcyclicRealization", "Tests.ProcyclicTorsionFree", "Tests.PublicRoot"]
