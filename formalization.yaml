version: "v0.4"

project:
  name: Profinite Groups
  description: >-
    Reusable Lean APIs for finite-stage limits, finite-target map colimits,
    maps into limits of finite-space diagrams,
    profinite-group morphisms, finite-quotient Hom systems, compatible
    quotient-subgroup and Sylow families, closed
    subgroups with Sylow finite images, finite-quotient conjugacy, continuous
    sections, free profinite and pro-p constructions,
    primewise p-adic models, and procyclic invariants, power images, and
    closed-subgroup inheritance.
  authors:
    - Formal Frontier Agents
  responsible_maintainers:
    - Beacon
  license: Apache-2.0

sources:
  - title: Cohomology of Number Fields (corrected second edition, electronic version 2.3, May 2020)
    authors:
      - Jürgen Neukirch
      - Alexander Schmidt
      - Kay Wingberg
    type: book
    location: >-
      Chapter I, section 1 (including exercises 1 and 3–5);
      section 6 (finite-quotient pro-p and Sylow arguments);
      section 7 (before proposition 1.7.7).
    relationship: background
    note: >-
      Source of cited characterizations and exercises and motivation for further
      finite-image and procyclic APIs; the library is source-independent.
      This entry is not a source-correspondence or completion decision.

related_formalizations:
  - id: https://github.com/leanprover-community/mathlib4
    relationship: builds-on
    note: >-
      Pinned mathlib revision 83abb3e776bdefcbc447a1e44d0debe4010039e5;
      provides profinite categories and completions, p-adic structures and
      general topology/algebra. Its own notices and license remain applicable.
  - id: https://github.com/FormalFrontier/group-theory
    relationship: builds-on
    note: >-
      Pinned Group Theory revision 01047a79bed13ee795d40b61b777566f2160e5cc;
      its open-quotient theorem was first formalized in this library and now
      supplies the totally disconnected coset-space instance.

classification:
  arxiv: [math.GR, math.NT]
  msc2020: ["22C05", "20E18"]

status:
  scope: >-
    Production modules and checked-use clients have separate import roots.
    For any small nonempty cofiltered diagram of finite discrete spaces and
    any limiting cone, stage maps to a finite target form a filtered colimit
    equivalent to continuous maps from its limit, naturally in the target.
    Empty stages, limits and targets are allowed, but not an empty index.
    For an arbitrary diagram of finite-space targets with a specified limiting
    profinite cone, continuous maps from a specified cofiltered finite-space
    limit correspond to compatible stage-map classes at the target objects;
    the target index need not be cofiltered, small or nonempty. This is a
    comparison of profinite spaces and continuous maps, not groups.
    For two small nonempty cofiltered diagrams in the finite-set skeleton,
    morphisms between their canonical dual ind-objects correspond to
    compatible finite-stage map classes, with representative, composition,
    identity and fixed-index naturality laws. Specified limiting cones
    identify these morphisms with continuous maps of profinite spaces; no
    presentation-independent pro-category equivalence is asserted.
    Compatible quotient images reconstruct closed subgroups, and arbitrary
    prescribed quotient-level Sylow coordinates extend to compatible families
    and closed subgroups with Sylow finite images. Maximality is conditional on
    every actual finite quotient image of a containing subgroup being a p-group;
    independently conjugate images of closed subgroups yield an ambient conjugator.
    Procyclic power images classify open subgroups, not all closed subgroups
    of an arbitrary procyclic group. The closed-subgroup classification is
    for the specific primewise p-adic product. Nevertheless, every closed
    subgroup of a procyclic profinite group inherits procyclicity.

automation:
  methods:
    - method: agent
      framework: Codex CLI and Hive Tasks
      tool_setup: >-
        AI agents developed code and documentation with a pinned Lean/mathlib
        Lake environment; independent agent executions reviewed mathematics.
      prompting_notes: >-
        Mathematical assumptions, source boundaries and concrete declarations
        are explained in README.md, docs/Mathematics.md and docs/API.md.
  notes: >-
    Beacon contributed the initial implementation, coordinated integration
    and contributed API and regression-client repairs. Formal Frontier Agents
    contributed further mathematics, tests, reference documentation and
    independent reviews. The native reference adapter and catalogue follow
    the finite-group Tate cohomology, polynomial-root-stability and Anchor
    ideal-completion adaptation lineage; Folio contributed headline input.

review:
