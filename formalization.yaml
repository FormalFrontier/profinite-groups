version: "v0.4"

project:
  name: Profinite Groups
  description: >-
    Reusable Lean APIs for profinite-group morphisms, finite-quotient Hom
    systems, continuous sections, free profinite and pro-p constructions,
    primewise p-adic models, and procyclic invariants and power images.
  authors:
    - Formal Frontier Agents
  responsible_maintainers:
    - Beacon
  license: Apache-2.0

sources:
  - title: Cohomology of Number Fields (corrected second edition, electronic version 2.3, May 2020)
    authors:
      - Jürgen Neukirch
      - Alexander Schmidt
      - Kay Wingberg
    type: book
    location: Chapter I, section 1, exercises 1 and 3–5; section 7
    relationship: background
    note: >-
      Mathematical motivation for some APIs; the library is source-independent.
      This entry is not a source-correspondence or completion decision.

related_formalizations:
  - id: https://github.com/leanprover-community/mathlib4
    relationship: builds-on
    note: >-
      Pinned mathlib revision e37d88a26f3791ed5a93daa1f949af1021b8d103;
      provides profinite categories and completions, p-adic structures and
      general topology/algebra. Its own notices and license remain applicable.

classification:
  arxiv: [math.GR, math.NT]
  msc2020: ["22C05", "20E18"]

status:
  scope: >-
    One production root imports 24 Lean leaves; a separate test root imports
    13 checked-use client leaves. The 39-module filtered native API includes
    declarations and instances, not private declarations or proof bodies.
    Procyclic power images classify open subgroups, not all closed subgroups
    of an arbitrary procyclic group. The closed-subgroup classification is
    for the specific primewise p-adic product.

automation:
  methods:
    - method: agent
      framework: Codex CLI and Hive Tasks
      tool_setup: >-
        AI agents developed code and documentation with a pinned Lean/mathlib
        Lake environment; independent agent executions reviewed mathematics.
      prompting_notes: >-
        Mathematical assumptions, source boundaries and concrete declarations
        are explained in README.md, docs/Mathematics.md and docs/API.md.
  notes: >-
    Beacon contributed the initial implementation, coordinated integration
    and contributed API and regression-client repairs. Formal Frontier Agents
    contributed further mathematics, tests, reference documentation and
    independent reviews. The native reference adapter and catalogue follow
    the finite-group Tate cohomology, polynomial-root-stability and Anchor
    ideal-completion adaptation lineage; Folio contributed headline input.

review:
  status: other
  reviewers: []
  notes: >-
    Exact-commit review, proof-integrity checks and release decisions are
    recorded in repository issue, pull-request and publication records.
    This metadata is not a review verdict or source-coverage decision.

acknowledgements: >-
  Formal Frontier Agents, including Beacon, mathematical and client-test
  contributors, reference-adapter contributors, and Folio's documentation
  input, built on mathlib and mathematical ideas from the cited book.
  Project author credit does not replace upstream contributor or third-party
  attribution and does not assert a copyright holder.
